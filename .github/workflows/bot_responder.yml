name: Bot Responder

on:
  schedule:
    # Runs every 5 minutes - checks for messages you sent to the bot
    - cron: '*/5 * * * *'
  workflow_dispatch: # Manual trigger

jobs:
  respond:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore offset cache
        uses: actions/cache@v4
        with:
          path: last_update_offset.txt
          key: bot-offset-${{ github.run_id }}
          restore-keys: |
            bot-offset-

      - name: Check and reply to messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_responder.py

      - name: Save offset cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_update_offset.txt
          key: bot-offset-${{ github.run_id }}
